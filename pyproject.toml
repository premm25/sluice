[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sluice-mcp"
version = "0.1.0"
description = "Information-flow control for AI agents: a zero-dependency MCP proxy that stops prompt-injection-driven data exfiltration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "premm25" }]
keywords = ["mcp", "model-context-protocol", "ai-security", "prompt-injection", "llm", "agents", "taint-tracking", "dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/premm25/sluice"
Issues = "https://github.com/premm25/sluice/issues"

[project.scripts]
sluice = "sluice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "SIM108", "SIM105"]
