name: release

# Publishing a GitHub release builds the package and uploads it to PyPI.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repo.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          SLUICE_HOME=/tmp/home /tmp/try/bin/sluice demo --fast
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sluice-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
